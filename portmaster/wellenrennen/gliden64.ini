# GLideN64 settings for the OpenGL ES renderer: cheapest options first.
# Keys and values as in mupen64plus' [Video-GLideN64] section.

[Video-General]
Fullscreen = True
ScreenWidth = 640
ScreenHeight = 480
VerticalSync = False

[Video-GLideN64]
# Render at the N64's own resolution (320x240) and scale to the screen.
UseNativeResolutionFactor = 1
MultiSampling = 0
FXAA = False
AspectRatio = 1
anisotropy = 0
bilinearMode = True
enableHalosRemoval = False
EnableHybridFilter = False
EnableDitheringPattern = False
EnableHiresNoiseDithering = False
DitheringQuantization = False
RDRAMImageDitheringMode = 0
EnableLOD = True
EnableHWLighting = False
EnableCoverage = False
EnableLegacyBlending = True
EnableFragmentDepthWrite = False
EnableInaccurateTextureCoordinates = True
EnableShadersStorage = True
AsyncShaderCompilation = False
# Moves GL calls to a second core; the render thread was the bottleneck.
ThreadedVideo = True
# Frame buffer emulation stays on; the expensive GPU -> RDRAM copies are off.
EnableFBEmulation = True
EnableCopyColorToRDRAM = 0
EnableCopyDepthToRDRAM = 0
EnableCopyColorFromRDRAM = False
EnableCopyAuxiliaryToRDRAM = False
EnableN64DepthCompare = 0
BackgroundsMode = 0
txFilterMode = 0
txEnhancementMode = 0
txHiresEnable = False
ShowFPS = False
